<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — AURORA</title><link rel="stylesheet" href="/style.css"></head><body class="admin-page"><div class="admin-shell">
<header class="admin-top"><div><p class="eyebrow">AURORA° · DÉMO CLIENT</p><h1>Gestion des commandes</h1></div><button class="ghost-btn" id="logout" hidden>Se déconnecter</button></header>
<section class="admin-login" id="loginPanel"><p class="eyebrow">ACCÈS PRIVÉ</p><h2>Administration</h2><p class="checkout-intro">Utilisez le mot de passe administrateur défini dans le fichier <code>.env</code>.</p><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe administrateur"><button class="primary wide" id="loginBtn">Se connecter →</button><p class="form-status" id="loginStatus"></p></section>
<section id="dashboard" hidden><div class="admin-stats"><div class="stat"><span>Commandes</span><strong id="sAll">0</strong></div><div class="stat"><span>Payées</span><strong id="sPaid">0</strong></div><div class="stat"><span>Préparées</span><strong id="sPrep">0</strong></div><div class="stat"><span>Expédiées</span><strong id="sShip">0</strong></div></div><div class="admin-tools"><input class="admin-search" id="search" placeholder="Rechercher une commande, un client, un e-mail, un produit ou un suivi…"><button class="ghost-btn" id="reload">Actualiser</button><button class="ghost-btn" id="reset">Réinitialiser la démo</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Commande</th><th>Client</th><th>Paiement</th><th>Statut</th><th>Total</th><th>Date</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section></div>
<div class="modal" id="adminModal" hidden><div class="admin-modal-card"><button class="modal-close" id="adminClose" aria-label="Fermer">×</button><div id="adminDetail"></div></div></div><script src="/admin.js"></script></body></html>
