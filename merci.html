<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>धन्यवाद — गौ माता</title>
<style>
:root{--ink:#2a1408;--maroon:#7c1f1d;--gold:#d8a73d;--cream:#fbf1de;--orange:#e2790a;--green:#3b5e38}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#fff8ea 0,var(--cream) 55%,#f1dfbd 100%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(620px,100%);background:rgba(255,255,255,.86);border:1px solid rgba(216,167,61,.65);border-radius:18px;padding:42px 34px;text-align:center;box-shadow:0 24px 70px -35px rgba(42,20,8,.55)}.icon{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:34px}h1{margin:0;color:var(--maroon);font-size:clamp(30px,6vw,44px)}.lead{font-size:18px;line-height:1.65;color:#5a4028;margin:14px auto 0;max-width:48ch}.amount{font-size:36px;font-weight:800;color:var(--maroon);margin:24px 0 4px}.status{color:#6b4b32;margin:0}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}.btn{display:inline-block;padding:13px 20px;border-radius:7px;text-decoration:none;font-weight:750}.primary{background:var(--orange);color:#2a1300}.secondary{border:1px solid rgba(42,20,8,.25);color:var(--ink);background:#fff}.small{margin-top:22px;font-size:13px;color:#7a5a3d}.error .icon{background:var(--maroon)}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="icon" id="icon">✓</div>
  <h1 id="title">भुगतान की पुष्टि हो रही है…</h1>
  <p class="lead" id="message">कृपया एक क्षण प्रतीक्षा करें। Stripe से सुरक्षित रूप से भुगतान की स्थिति जाँची जा रही है।</p>
  <div id="paymentDetails" hidden><div class="amount" id="amount"></div><p class="status">आपका दान सफलतापूर्वक प्राप्त हुआ।</p></div>
  <div class="actions"><a class="btn primary" href="/">मुखपृष्ठ पर लौटें</a><a class="btn secondary" href="/#give">एक और दान करें</a></div>
  <p class="small">आपकी सहायता के लिए हृदय से धन्यवाद।</p>
</main>
<script>
(async()=>{
 const id=new URLSearchParams(location.search).get('session_id');
 const card=document.getElementById('card'),title=document.getElementById('title'),msg=document.getElementById('message'),details=document.getElementById('paymentDetails'),amount=document.getElementById('amount'),icon=document.getElementById('icon');
 function fail(t,m){card.classList.add('error');icon.textContent='!';title.textContent=t;msg.textContent=m}
 if(!id){fail('भुगतान संदर्भ नहीं मिला','Stripe सत्र पहचानकर्ता अनुपस्थित है। कृपया मुखपृष्ठ पर लौटें।');return}
 try{
   const r=await fetch('/api/donation-status?session_id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'सत्यापन विफल');
   if(d.paid){title.textContent='धन्यवाद — आपका दान प्राप्त हुआ';msg.textContent='Stripe ने आपके भुगतान की पुष्टि कर दी है। गौ सेवा में आपके सहयोग के लिए धन्यवाद।';amount.textContent=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((d.amount||0)/100);details.hidden=false}
   else fail('भुगतान अभी पुष्टि नहीं हुआ','Stripe स्थिति: '+(d.payment_status||'unknown')+'. यदि आपने भुगतान किया है, कुछ क्षण बाद इस पृष्ठ को पुनः लोड करें।')
 }catch(e){fail('भुगतान सत्यापित नहीं हो सका',e.message)}
})();
</script>
</body>
</html>
