<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>धन्यवाद — गौ माता</title><style>body{font-family:system-ui,sans-serif;background:#fbf1de;color:#2a1408;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px}.box{max-width:560px;background:white;border:1px solid #d8a73d;border-radius:10px;padding:36px;box-shadow:0 18px 40px -20px #2a140866}h1{color:#7c1f1d}.amount{font-size:32px;font-weight:700}.muted{color:#6b4b32}a{display:inline-block;margin-top:20px;background:#e2790a;color:#2a1300;padding:12px 18px;text-decoration:none;border-radius:4px;font-weight:700}</style></head><body><main class="box"><h1 id="title">भुगतान सत्यापित हो रहा है…</h1><div id="details" class="muted">Stripe से भुगतान की स्थिति जाँची जा रही है।</div><a href="/">मुखपृष्ठ पर लौटें</a></main><script>(async()=>{const id=new URLSearchParams(location.search).get('session_id');if(!id)return document.getElementById('title').textContent='सत्र नहीं मिला';try{const r=await fetch('/api/donation-status?session_id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error||'त्रुटि');if(d.paid){document.getElementById('title').textContent='धन्यवाद — भुगतान सफल हुआ';document.getElementById('details').innerHTML='<p class="amount">'+new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(d.amount/100)+'</p><p>Stripe ने भुगतान की पुष्टि की है.</p>'}else{document.getElementById('title').textContent='भुगतान अभी पुष्टि नहीं हुआ';document.getElementById('details').textContent='स्थिति: '+d.payment_status}}catch(e){document.getElementById('title').textContent='सत्यापन नहीं हो सका';document.getElementById('details').textContent=e.message}})()</script></body></html>
